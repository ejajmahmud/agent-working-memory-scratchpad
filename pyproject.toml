[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-working-memory-scratchpad"
version = "0.1.0"
description = "Typed ephemeral working memory with stack-based push/pop scopes and variable binding for complex chain-of-thought"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
agent-working-memory-scratchpad = "agent_working_memory_scratchpad.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_working_memory_scratchpad*"]
